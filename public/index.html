<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bre AI</title>
  <meta name="description" content="Bre AI - Engineered by Amirun Rayan Ariandi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="layout">
  <div id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar">
    <div class="sb-header">
      <div class="sb-brand">Bre AI</div>
      <button class="icon-btn mobile-only" onclick="toggleSidebar(false)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>
    <div class="chat-list-title">Recent</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sb-footer">
      <div class="creator-stamp">By Amirun Rayan Ariandi</div>
      <button class="admin-btn" onclick="openAdmin()" title="Basic Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings</span>
      </button>
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn sb-toggle" onclick="toggleSidebar()" title="Toggle Sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="persona-select-wrapper">
          <select id="personaSelect" onchange="setPersona(this.value)">
            <option value="default">⚡ General Intelligence</option>
            <option value="coder">💻 Principal Software Engineer</option>
            <option value="prd">📋 Product Manager (PRD Specialist)</option>
            <option value="uiux">🎨 UI/UX & Frontend Specialist</option>
            <option value="math">🔬 Scientist & Mathematics (KaTeX)</option>
            <option value="security">🛡️ Cybersecurity & Pentest</option>
            <option value="writer">✍️ Master Copywriter & Writer</option>
            <option value="business">📈 Business & Financial Analyst</option>
            <option value="academic">🎓 Academic & Paper Researcher</option>
            <option value="ml">🤖 AI & Machine Learning Engineer</option>
            <option value="legal">⚖️ Legal & Contract Consultant</option>
            <option value="medical">🩺 Medical & Health Scientist</option>
            <option value="translator">🗣️ Polyglot Master Translator</option>
            <option value="philosophy">🧠 Philosophy & Deep Reasoner</option>
          </select>
          <svg class="dropdown-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnTTS" onclick="toggleTTS()" title="Text-to-Speech"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
      </div>
    </header>
    <div id="messagesContainer"><div id="messages"></div></div>
    <div class="input-container">
      <div class="input-box">
        <div class="attach-bar" id="attachBar"></div>
        <div class="input-row">
          <button class="icon-btn attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach File"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
          <textarea id="msgInput" rows="1" placeholder="Message Bre AI..."></textarea>
          <button class="icon-btn mic-btn" id="btnMic" onclick="toggleMic()" title="Voice Input"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
          <button class="send-btn" id="btnSend" onclick="sendOrStop()"><svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><svg id="stopIcon" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"></rect></svg></button>
        </div>
      </div>
      <div class="footer-hint" id="footerHint">Bre AI can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<!-- Settings Modal (Theme & Data) -->
<div class="modal-backdrop" id="adminModal" onclick="if(event.target===this)closeModal('adminModal')">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Settings & Preferences</h2>
      <button class="icon-btn" onclick="closeModal('adminModal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="cfgView">
      
      <!-- Language Selector -->
      <div class="field" style="margin-bottom: 20px;">
        <label style="font-weight: 600; margin-bottom: 8px;" id="lblLanguage">🌐 Language / Bahasa</label>
        <select id="langSelect" class="f-input" onchange="setLanguage(this.value)" style="cursor: pointer; font-weight: 500;">
          <option value="en">🇺🇸 English (Default)</option>
          <option value="id">🇮🇩 Bahasa Indonesia</option>
          <option value="ja">🇯🇵 日本語 (Japanese)</option>
          <option value="zh">🇨🇳 中文 (Chinese)</option>
          <option value="es">🇪🇸 Español (Spanish)</option>
          <option value="ar">🇸🇦 العربية (Arabic)</option>
          <option value="de">🇩🇪 Deutsch (German)</option>
          <option value="fr">🇫🇷 Français (French)</option>
          <option value="ru">🇷🇺 Русский (Russian)</option>
          <option value="ko">🇰🇷 한국어 (Korean)</option>
        </select>
      </div>

      <!-- Theme Switcher -->
      <div class="field" style="margin-bottom: 24px;">
        <label style="font-weight: 600; margin-bottom: 8px;" id="lblTheme">Appearance Theme</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
          <button class="theme-opt-btn" id="themeLight" onclick="setTheme('light')">☀️ Light</button>
          <button class="theme-opt-btn" id="themeDark" onclick="setTheme('dark')">🌙 Dark</button>
          <button class="theme-opt-btn" id="themeSystem" onclick="setTheme('system')">💻 System</button>
        </div>
      </div>

      <!-- Data Section -->
      <div class="field">
        <label style="font-weight: 600; margin-bottom: 8px;" id="lblData">Chat History (Data)</label>
        <div class="stats-box">
          <div><span id="sSessions">0</span> <span id="lblChatsCount">Chats</span></div>
          <div><span id="sMsgs">0</span> <span id="lblMsgsCount">Messages</span></div>
        </div>
        <div class="flex gap-2 mt-4">
          <button class="f-btn outline" id="btnExport" onclick="exportJSON()">📥 Export JSON</button>
          <button class="f-btn danger" id="btnClearAll" onclick="clearAllChats()">🗑️ Clear All History</button>
        </div>
      </div>
      
    </div>
    <div class="modal-footer" id="cfgFooter">
      <button class="f-btn primary" id="btnCloseModal" onclick="closeModal('adminModal')">Close</button>
    </div>
  </div>
</div>

<div id="toastHub" class="toast-hub"></div>
<div class="modal-backdrop" id="previewModal" onclick="if(event.target===this)closeModal('previewModal')">
  <div class="modal preview">
    <div class="modal-header">
      <h2>Live Preview</h2>
      <div class="flex gap-1">
        <button class="icon-btn" onclick="reloadPreview()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
        <button class="icon-btn" onclick="closeModal('previewModal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div class="modal-body p-0" style="height:100%"><iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals" style="width:100%;height:100%;border:none;background:#fff;"></iframe></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
